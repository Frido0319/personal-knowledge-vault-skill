name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Compile runtime and Skill scripts
        run: python -m compileall -q src skills/build-personal-knowledge-vault/scripts scripts
      - name: Audit public tree
        run: python scripts/privacy_audit.py --root .
      - name: Run offline synthetic acceptance
        run: python scripts/synthetic_acceptance.py --workspace "${{ runner.temp }}/personal-vault-acceptance"
      - name: Parse native PowerShell assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem platform/windows -Filter *.ps1 | ForEach-Object {
            [ScriptBlock]::Create((Get-Content -LiteralPath $_.FullName -Raw)) | Out-Null
          }
      - name: Confirm tests did not modify tracked source
        run: git diff --exit-code
