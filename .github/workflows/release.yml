name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}", "tag/version mismatch"
          PY
      - name: Run release gates
        run: |
          python -m pytest -q
          python scripts/privacy_audit.py --root .
          python scripts/synthetic_acceptance.py --workspace "${{ runner.temp }}/personal-vault-release-acceptance"
      - name: Build deterministic release
        run: python scripts/build_release.py --output dist
      - name: Verify artifact checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: personal-knowledge-vault-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.skill
            dist/SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*.whl dist/*.skill dist/SHA256SUMS
          --verify-tag --generate-notes --title "Personal Knowledge Vault ${GITHUB_REF_NAME}"
